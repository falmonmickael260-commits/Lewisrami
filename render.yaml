# Déploiement Render — « New + » → « Blueprint » → ce dépôt.
# Aucun jeton à créer : Render lit ce fichier depuis GitHub.
#
# Un seul exemplaire (numInstances: 1) : le serveur détient l'état des parties
# en mémoire et pousse les mises à jour par SSE. Plusieurs exemplaires
# répartiraient les joueurs d'une même salle sur des processus différents.
services:
  - type: web
    name: lewisrami
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Plan gratuit : le service s'endort après 15 min sans trafic et perd les
    # parties en mémoire au réveil. Passer à `starter` pour un serveur qui
    # tourne en continu.
    plan: free
    region: frankfurt
    numInstances: 1
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # Rien d'autre à renseigner : le jeu fonctionne tel quel.
      #
      # La persistance Supabase est FACULTATIVE. Elle ne sert qu'à faire
      # survivre les salles à un redémarrage du serveur — utile en plan
      # gratuit, où le service s'endort après 15 min sans joueur.
      # Pour l'activer plus tard, ajouter ces deux variables depuis
      # l'onglet « Environment » du service, sans toucher à ce fichier :
      #
      #   NEXT_PUBLIC_SUPABASE_URL   = https://xxxx.supabase.co
      #   SUPABASE_SERVICE_ROLE_KEY  = clé « secret » (jamais la publique)
      #
      # Elles ne sont pas déclarées ici exprès : déclarées, Render les
      # réclame au moment de créer le service, et bloque celui qui ne les
      # a pas encore.
